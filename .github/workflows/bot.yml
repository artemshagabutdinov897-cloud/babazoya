name: bot
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: babazoya-bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOOK_KEY: ${{ secrets.BOOK_KEY }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          CLUB_KEY: ${{ secrets.CLUB_KEY }}
          BRATUHA_API_KEY: ${{ secrets.BRATUHA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PRICE_STARS: "600"
          PROMO_STARS: "450"
          CLUB_STARS: "100"
        run: python bot/bot.py
