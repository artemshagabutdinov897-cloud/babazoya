name: links
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create invoice links
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          YK_TOKEN: ${{ secrets.YK_TOKEN_LIVE }}
          NY_RUB: "290"
          NY_STARS: "135"
          GIFT_RUB: "490"
          GIFT_STARS: "225"
          BOOK_RUB: "490"
          BOOK_STARS: "225"
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          T = os.environ["BOT_TOKEN"]; YK = os.environ.get("YK_TOKEN", "")
          APP = "https://babazoya.github.io/"
          def call(**p):
              req = urllib.request.Request(f"https://api.telegram.org/bot{T}/createInvoiceLink",
                                           data=json.dumps(p).encode(), headers={"Content-Type": "application/json"})
              r = json.load(urllib.request.urlopen(req, timeout=30))
              if not r.get("ok"): raise SystemExit(r.get("description"))
              return r["result"]
          base = dict(title="Новогодний стол бабы Зои",
                      description="35 праздничных рецептов, план по дням на 28–31 декабря, меню и список покупок. В приложении и PDF в чат.",
                      payload="ny-v1", photo_url=APP + "img/ny/cover.jpg")
          out = {"ny": call(currency="XTR", prices=[{"label": "Книга", "amount": int(os.environ["NY_STARS"])}], **base)}
          if YK:
              out["nyRub"] = call(currency="RUB", provider_token=YK, prices=[{"label": "Книга", "amount": int(os.environ["NY_RUB"]) * 100}], **base)
          g = dict(title="Книжка «Бабушкин стол» в подарок",
                   description="Пришлю тебе открытку со ссылкой — перешлёшь её тому, кому даришь. Открыть подарок можно один раз.",
                   payload="gift-v1", photo_url=APP + "img/mockup.jpg", photo_width=1080, photo_height=1935)
          out["gift"] = call(currency="XTR", prices=[{"label": "Книга", "amount": int(os.environ["GIFT_STARS"])}], **g)
          if YK:
              out["giftRub"] = call(currency="RUB", provider_token=YK, prices=[{"label": "Книга", "amount": int(os.environ["GIFT_RUB"]) * 100}], **g)
          bk = dict(title="Бабушкин стол — 100 рецептов",
                    description="Вся книга бабы Зои: 100 деревенских рецептов для лёгкого живота, правила, меню на неделю. В приложении и PDF в чат.",
                    payload="book-v1", photo_url=APP + "img/mockup.jpg", photo_width=1080, photo_height=1935)
          out["book"] = call(currency="XTR", prices=[{"label": "Книга", "amount": int(os.environ["BOOK_STARS"])}], **bk)
          if YK:
              out["bookRub"] = call(currency="RUB", provider_token=YK, prices=[{"label": "Книга", "amount": int(os.environ["BOOK_RUB"]) * 100}], **bk)
          import re
          c = open("config.js", encoding="utf-8").read()
          c = re.sub(r'invoice: "[^"]*"', 'invoice: "' + out["book"] + '"', c)
          if "bookRub" in out: c = re.sub(r'invoiceRub: "[^"]*"', 'invoiceRub: "' + out["bookRub"] + '"', c)
          c = re.sub(r'price: "[^"]*"', 'price: "' + os.environ["BOOK_STARS"] + ' ⭐"', c)
          c = re.sub(r'priceRub: "[^"]*"', 'priceRub: "' + os.environ["BOOK_RUB"] + ' ₽"', c)
          c = re.sub(r'v: (\d+)', lambda m: "v: " + str(int(m.group(1)) + 1), c)
          open("config.js", "w", encoding="utf-8").write(c)
          os.makedirs("data", exist_ok=True)
          json.dump(out, open("data/links.json", "w"), ensure_ascii=False)
          print("links:", ", ".join(out))
          PY
      - name: save
        run: |
          git config user.name "artemshagabutdinov897-cloud"
          git config user.email "artemshagabutdinov897@gmail.com"
          git add data/links.json config.js
          git commit -m "Ссылки на оплату в мини-аппе" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 5; done
