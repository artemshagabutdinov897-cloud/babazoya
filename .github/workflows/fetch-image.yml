name: fetch-image
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      path:
        required: true
      width:
        required: false
        default: "1080"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env:
          URL: ${{ inputs.url }}
          OUT: ${{ inputs.path }}
          W: ${{ inputs.width }}
        run: |
          pip install -q pillow
          curl -sSL -o /tmp/src "$URL"
          python3 -c "import os; from PIL import Image; im=Image.open('/tmp/src').convert('RGB'); w=int(os.environ['W']); im=im.resize((w, round(im.height*w/im.width)), Image.LANCZOS); im.save(os.environ['OUT'], quality=85, optimize=True, progressive=True)"
          ls -la "$OUT"
          git config user.name "artemshagabutdinov897-cloud"
          git config user.email "artemshagabutdinov897@gmail.com"
          git add "$OUT"
          git commit -m "img: $OUT"
          git push
